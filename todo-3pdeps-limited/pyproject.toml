[project]
name = "todo-3pdeps-limited"
version = "0.1.0"
description = "Todo web app — limited third-party dependencies (deps progressively replaced with purpose-built code)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "flask-login>=0.6.3",
    "flask-wtf>=1.3.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Non-behavioral lines that need not be exercised by the behavioral suite.
exclude_also = [
    "def __repr__",
    "if TYPE_CHECKING:",
    "@(abc\\.)?abstractmethod",
]

